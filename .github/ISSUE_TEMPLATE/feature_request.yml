name: 기능 제안
description: 현장 촬영과 기록에 도움이 될 기능을 제안해 주세요.
title: "[제안] "
body:
  - type: markdown
    attributes:
      value: |
        실제 현장 정보 대신 가상의 유적·유구 이름으로 설명해 주세요.
  - type: textarea
    id: situation
    attributes:
      label: 어떤 상황에서 필요한가요?
      description: 현재 작업 흐름과 불편한 점을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작
      description: 제안한 기능을 어떻게 사용하고 싶은지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 지금 사용하는 방법
      description: 현재 다른 방법으로 해결하고 있다면 알려 주세요.
