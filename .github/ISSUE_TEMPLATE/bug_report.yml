name: 오류 신고
description: 촬영·저장·화면·현장 기록에서 발생한 문제를 알려 주세요.
title: "[오류] "
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 누구나 읽을 수 있습니다. 실제 현장명·GPS 좌표·연락처·원본 현장 사진은 포함하지 마세요.
        오류 메시지와 개인정보를 제거한 재현 예시만으로 설명해 주세요.
  - type: input
    id: app_version
    attributes:
      label: 앱 버전
      placeholder: "예: 1.1.3"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기와 Android 버전
      placeholder: "예: SM-G960N / Android 10"
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: 문제가 발생한 화면
      options:
        - 일반 휴대폰 화면
        - 폴더블 외부 화면
        - 폴더블 내부 화면
        - 접기·펼치기 전환 중
        - 해당 없음
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 누른 버튼과 문제가 발생한 시점을 순서대로 적어 주세요.
      placeholder: |
        1. 사진 모드에서 ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 기대한 동작과 실제 동작
      description: 오류 문구가 있으면 민감한 부분을 지우고 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 권한·저장 상황
      description: 사진 접근이 전체/선택/거부 중 무엇인지, 저장 공간 부족 여부 등 아는 범위만 적어 주세요.
